<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>Teacher sign-in — Life Lab</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;font-family:system-ui,sans-serif;background:#F5F0E6;color:#1C1B18;display:grid;place-items:center;min-height:100vh}main{max-width:420px;padding:32px;background:#FFFDF8;border-radius:20px;border:1px solid rgba(28,27,24,.1)}button{min-height:48px;border:0;border-radius:999px;background:#1C1B18;color:#F5F0E6;font-size:16px;font-weight:600;padding:0 22px;cursor:pointer}</style></head><body><main><h1 style="font-size:24px;margin:0 0 8px">Teacher sign-in</h1><p>This area is for staff with a <code>teacher</code> role. Sign in with your invited Netlify Identity account.</p><button id="b">Sign in</button></main><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><script>netlifyIdentity.init();document.getElementById('b').onclick=()=>netlifyIdentity.open('login');netlifyIdentity.on('login',()=>{location.href='/teacher'});</script></body></html>
